services:
  api:
    build:
      context: .
      args:
        REGISTRY: docker.m.daocloud.io/library
    ports:
      - "3002:3000"
    depends_on:
      - postgres
      - redis
    env_file: .env.development
    environment:
      DATABASE_URL: postgresql://clawmate:password@postgres:5432/clawmate
      REDIS_URL: redis://redis:6379
      TZ: Asia/Shanghai
    volumes:
      - .:/app
      - /app/node_modules
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx watch src/server.ts"]
    restart: unless-stopped

  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: clawmate
      POSTGRES_PASSWORD: password
      POSTGRES_DB: clawmate
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    command: ["postgres", "-c", "log_timezone=Asia/Shanghai", "-c", "timezone=Asia/Shanghai"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

volumes:
  pgdata:
  redisdata:
