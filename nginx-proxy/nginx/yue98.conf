server {
    listen 80;
    server_name yiqiyue98.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yiqiyue98.online;

    ssl_certificate /etc/letsencrypt/live/yiqiyue98.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yiqiyue98.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://yue98-app-prod-1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ota/ {
        alias /usr/share/nginx/ota/;
        expires 1d;
        gzip on;
        gzip_types application/json application/octet-stream;
        sendfile on;
    }

    location /emqx/ {
        proxy_pass http://yue98-emqx-1:18083/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http://$host/ http://$host/emqx/;
        sub_filter_once off;
        sub_filter_types *;
        sub_filter 'href="/' 'href="/emqx/';
        sub_filter 'src="/' 'src="/emqx/';
        sub_filter 'url("/' 'url("/emqx/';
    }

    location /ws {
        proxy_pass http://yue98-app-prod-1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
